name: LivePro Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - name: Compile and Print Error
        run: |
          if [ ! -x ./gradlew ]; then gradle wrapper --gradle-version 8.6 --distribution-type bin; chmod +x ./gradlew; fi
          set +e
          ./gradlew assembleDebug > build_full.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ BUILD FAILED ❌"
            grep -E "^e: |error:|FAILURE: Build failed" build_full.log || tail -n 100 build_full.log
          else
            echo "✅ BUILD SUCCESSFUL"
          fi
          exit $EXIT_CODE
