plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tvflux.pro'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvflux.pro'
        minSdk 21
        targetSdk 34
        multiDexEnabled true
        versionCode 600
        versionName '6.0.0-BEIN-DARK'
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def ksFile = rootProject.file("keystore/livepro-release.jks")
            def storePassEnv = System.getenv("LIVEPRO_STORE_PASS") ?: ""
            def keyPassEnv = System.getenv("LIVEPRO_KEY_PASS") ?: storePassEnv
            def keyAliasEnv = System.getenv("LIVEPRO_KEY_ALIAS") ?: "livepro_key"
            if (ksFile.exists() && !storePassEnv.isEmpty()) {
                storeFile ksFile
                storePassword storePassEnv
                keyAlias keyAliasEnv
                keyPassword keyPassEnv
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            def ksFile = rootProject.file("keystore/livepro-release.jks")
            def storePassEnv = System.getenv("LIVEPRO_STORE_PASS") ?: ""
            if (ksFile.exists() && !storePassEnv.isEmpty()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi"
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'UnsafeOptInUsageError', 'MissingTvBanner', 'ObsoleteSdkInt'
        abortOnError false
        checkReleaseBuilds true
        textReport true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'

    // Official WireGuard Tunnel Library (GoBackend + libwg-go.so)
    implementation 'com.wireguard.android:tunnel:1.0.20230706'

    // Media3 ExoPlayer Full Production Suite (HLS / M3U8 / TS / DASH / RTSP)
    def media3_version = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:${media3_version}"
    implementation "androidx.media3:media3-exoplayer-dash:${media3_version}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3_version}"
    implementation "androidx.media3:media3-exoplayer-rtsp:${media3_version}"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:${media3_version}"
    implementation "androidx.media3:media3-extractor:${media3_version}"
    implementation "androidx.media3:media3-ui:${media3_version}"
    implementation "androidx.media3:media3-datasource-okhttp:${media3_version}"
    implementation "androidx.media3:media3-common:${media3_version}"

    // High-performance Networking & Concurrency
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
